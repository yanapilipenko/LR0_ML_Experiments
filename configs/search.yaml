
experiment: lr0_search

split_seed: 0
seed: 0

runtime:
  device: cpu
  num_threads: 1

search:
  study_name: lr0_search
  storage: sqlite:///optuna.db
  n_trials: 40

  sampler_seed: 42

  pruner:
    n_startup_trials: 5
    n_warmup_steps: 5

  epochs: 30

  params:
    lr:
      min: 0.0001
      max: 0.1

    n_layers:
      min: 1
      max: 3

    hidden:
      min: 32
      max: 512

    dropout:
      min: 0.0
      max: 0.5

    weight_decay:
      min: 0.000001
      max: 0.01

    batch_size:
      values: [32, 64, 128]
